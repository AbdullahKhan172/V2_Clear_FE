  <rect width="36" height="36" rx="9" fill="#1e8a5e"/>
  <text x="18" y="19" fill="#fff" font-size="22" font-weight="800"
        text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif">C</text>
</svg>
